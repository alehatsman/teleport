[package]
name = "teleportd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum               = { version = "0.8", features = ["ws"] }
tower              = { version = "0.5", features = ["util"] }
tower-http         = { version = "0.6", features = ["fs", "trace"] }
portable-pty       = "0.9"
rusqlite           = { version = "0.32", features = ["bundled"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid               = "1"
clap               = { version = "4", features = ["derive"] }
directories        = "5"
# `session.rs`'s locks never poison on panic-while-held -- a std::sync::Mutex
# would take down every future call for that session (only that session, but
# still) if anything ever panicked under one. Small, boring, no unsafe of its
# own; MVP-wide review pass, 2026-09-05.
parking_lot        = "0.12"
# Not in docs/02-stack-decisions.md's pinned list; added to satisfy the "256 bits
# from the OS CSPRNG" requirement in docs/06-security.md#the-credential — see
# the M0 commit message. Tiny, dependency-free wrapper over
# getrandom/getentropy/BCryptGenRandom; already pulled in transitively via
# ulid -> rand.
getrandom          = "0.2"
# `embedded-web` feature only (docs/16-release-pipeline.md#embedding-the-web-ui-embedded-web-feature).
# Optional so a normal `cargo build`/`cargo test` never needs `web/dist` to
# exist and never bakes in stale assets.
rust-embed         = { version = "8", optional = true }
mime_guess         = { version = "2", optional = true }

[features]
embedded-web = ["dep:rust-embed", "dep:mime_guess"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# M4 protocol tests drive `api.rs` in-process (no real socket needed) and
# `ws.rs` over a real one. `tower`'s `ServiceExt::oneshot` (a real
# `[dependencies]` entry as of M5, for the SPA-fallback dispatch in
# `api.rs`) does the in-process driving; `tokio-tungstenite` is already
# pulled in transitively by axum's `ws` feature (axum vendors its WebSocket
# support on it) and just gets exposed to tests here.
tokio-tungstenite  = "0.29"
futures-util       = "0.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
