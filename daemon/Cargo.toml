[package]
name = "teleportd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum               = { version = "0.8", features = ["ws"] }
tower-http         = { version = "0.6", features = ["fs", "trace"] }
portable-pty       = "0.9"
rusqlite           = { version = "0.32", features = ["bundled"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid               = "1"
clap               = { version = "4", features = ["derive"] }
directories        = "5"
# Not in docs/02-stack-decisions.md's pinned list; added to satisfy the "256 bits
# from the OS CSPRNG" requirement in docs/06-security.md#the-credential — see
# the M0 commit message. Tiny, dependency-free wrapper over
# getrandom/getentropy/BCryptGenRandom; already pulled in transitively via
# ulid -> rand.
getrandom          = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# M4 protocol tests drive `api.rs` in-process (no real socket needed) and
# `ws.rs` over a real one. Both are already pulled in transitively by axum's
# `ws` feature (axum vendors its WebSocket support on tokio-tungstenite, and
# routing on tower); this just exposes the same machinery to tests instead of
# adding anything new to the dependency tree.
tower              = { version = "0.5", features = ["util"] }
tokio-tungstenite  = "0.29"
futures-util       = "0.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
