[package]
name = "spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
portable-pty = "0.9"
anyhow        = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
