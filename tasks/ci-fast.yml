---
description: fast pre-commit gate — lockfile drift, fmt, clippy, ai-lint, soft caps

# rq/ci-fast, which is `fast.yml` upstream. Same two crates as tasks/ci.yml,
# same reasons.
steps:
# daemon takes `feature_args: ""`. `--all-features` turns on `embedded-web`,
# an optional feature whose `RustEmbed` folder is `../web/dist` -- a release
# artifact built by npm in `web/`, absent from a normal checkout, and a
# compile-time error when the feature is on without it (daemon/src/
# embedded_web.rs says so at the top). GitHub CI builds the daemon with default
# features for the same reason. Gating a feature the checkout cannot build
# reports the build, not the code.
  - name: daemon
    use: ~/.cache/provision/tools/rust-quality/fast.yml
    props: { dir: daemon, feature_args: "" }

  - name: cli
    use: ~/.cache/provision/tools/rust-quality/fast.yml
    props: { dir: cli }
