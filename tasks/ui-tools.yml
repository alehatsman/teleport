---
description: check out ts-quality and install the web gate's tools (npm ci)

# The web half of tasks/tools.yml. Same shape: the pin lives here and nowhere
# else in this repo, and the checkout is a `git` step so a bump is one line
# and an offline machine still converges.
#
# No tag past v0.1.0 exists upstream, and v0.1.0 predates the provision
# migration (mooncake-only, and provision rejects its `name:` key outright).
# Pinned to a commit until a tag lands; re-pin to the tag then. This one is
# ts-quality#7 (+#9): the baseline's files.includes starts with "**" so biome
# actually scans, and config-check's biome-first-exception fails a stale
# base copy. #4 before it is docs/UI.md and the ui-lint step; #3 is what lets
# svelte-check run inside the gate.
steps:
  - vars:
      tq_ref: 4bcca6101689c394b73ea88bf63ce524beb9f6f2
      tq_dir: "{{ home }}/.cache/provision/tools/ts-quality"

  - name: "ts-quality at {{ tq_ref }}"
    git:
      repo: https://github.com/alehatsman/ts-quality.git
      dest: "{{ tq_dir }}"
      ref: "{{ tq_ref }}"

  # Not a `use:` of tq/tools for the same reason tasks/tools.yml calls
  # rust-quality's scripts.sh directly: a `use:` target is resolved when the
  # plan is parsed, before the git step above has run.
  #
  # tools.sh also downloads Playwright's chromium as a side effect now that
  # @playwright/test is a devDependency (docs/10-testing.md#web-e2e-
  # playwright) -- webkit (the "mobile" project's real-iPhone engine, see
  # tasks/ui-e2e.yml) isn't chromium and stays this task's own job, since
  # tools.sh has no opinion on e2e specifically.
  - name: install (npm ci)
    shell: cd web && bash "{{ tq_dir }}/scripts/tools.sh" install
    creates: web/node_modules/.package-lock.json
    timeout: 30m

  - name: verify
    shell: cd web && bash "{{ tq_dir }}/scripts/tools.sh" check
    changed_when: "false"
