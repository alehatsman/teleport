name: CI

# issue #113: every branch push, not just `main`. Most of this repo's work
# reaches `main` as direct merge commits rather than through PRs, so a
# `branches: [main]` filter means the first time CI sees a change is after it
# is already on `main` -- `780ff74` took the Windows daemon build down and
# stayed red for a day on exactly that workflow. Running on the branch turns
# the signal into something you get before the merge.
on:
  push:
  pull_request:

# A branch with an open PR fires both `push` and `pull_request` for the same
# commit. `head_ref || ref_name` resolves to the same branch name on both, so
# the pair lands in one group and the duplicate is cancelled. `main` is
# exempt from cancellation: there the run is the record of whether that commit
# is good, and a later push must not erase an earlier commit's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  daemon-fmt:
    name: daemon (fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # A `target_os` gate on a test is a platform quietly losing coverage, and
  # this repo has shipped two whose stated reasons did not survive being run
  # (#25/#32, #36). Cheap, no toolchain needed, so it runs on its own rather
  # than behind a build.
  test-gates:
    name: daemon (target_os gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-target-os-gates.sh

  daemon:
    name: daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> target
            anchor -> target

      # The 25 anchor fixtures are gated on `ANCHORD_BIN`, and a gate with
      # nothing behind it reports `ok` without running anything (#108). The
      # suite now refuses that: `ci_must_supply_an_anchord_binary` fails under
      # CI when the variable is unset, so this is the half that makes it pass
      # honestly rather than by removing the check.
      #
      # Pinned, not floating. Building anchor's `main` would mean a break
      # there turns this repo red for a reason that is not this repo's -- and
      # a job red for someone else's reason is how the next real failure gets
      # missed (#113). Bumping the SHA is a visible line in a diff, which is
      # the same argument `scripts/allowed-target-os-gates.tsv` makes: the
      # decision should be reviewable at the moment it is taken.
      #
      # The cost is real and worth naming: this pin goes stale silently, so
      # anchor's fixes do not reach teleport's suite until someone moves it.
      - name: Check out anchor (pinned)
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          repository: alehatsman/anchor
          ref: c755628bdf1515b2d10dab01a149e63a34eee33a
          path: anchor
      # Unix only: anchord speaks AF_UNIX and has no Windows transport
      # (anchor#13, deferred not-planned), which is why teleport's own anchor
      # modules are `#[cfg(unix)]` (#107). Every anchor fixture is
      # `#![cfg(unix)]` too, so on Windows there is nothing here to satisfy.
      - name: Build anchord
        if: runner.os != 'Windows'
        working-directory: anchor
        run: cargo build --release --bin anchord
      - name: Export ANCHORD_BIN
        if: runner.os != 'Windows'
        run: echo "ANCHORD_BIN=$GITHUB_WORKSPACE/anchor/target/release/anchord" >> "$GITHUB_ENV"

      - run: cargo build --all-targets
      # --no-fail-fast: one failing test binary used to hide every later one
      # (2026-09-05: cargo test stopping at the first failure hid three more
      # macOS-only fixtures behind it, discovered one CI round-trip at a
      # time until this flag showed the true, bounded scope in a single run).
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings

  daemon-audit:
    name: daemon (audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  cli-fmt:
    name: cli (fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - run: cargo build --all-targets
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings

  cli-audit:
    name: cli (audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # web/.npmrc sets engine-strict, and web/package.json's engines
          # field is ts-quality's baseline (node ^24 || >=26): npm ci on an
          # older node refuses outright rather than warning.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The same four steps tasks/ui-ci.yml runs locally through ts-quality,
      # minus the provision-only ones (config drift, supply-chain posture,
      # ai-lint, soft caps). Lint and vitest never ran in CI before this.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Separate from the `web` job above on purpose: this needs a real
  # teleportd binary (docs/10-testing.md#web-e2e-playwright's daemon
  # fixture) and real browsers, both slower than lint/typecheck/build/test,
  # so a plain typo doesn't wait on a Rust build + two browser downloads.
  web-e2e:
    name: web (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target
      - run: cargo build -p teleportd
        working-directory: daemon
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      # Not just `chromium`: the "mobile" project uses devices['iPhone 14'],
      # which is WebKit -- the real engine an iPhone runs, not Chromium's
      # mobile-viewport emulation (this app is mobile-first, and this
      # session's real bugs were WebKit-specific). ts-quality's tools.sh
      # only auto-installs chromium (it has no opinion on e2e), so both are
      # installed explicitly here rather than relied on from that gate.
      - working-directory: web
        run: npx playwright install --with-deps chromium webkit
      # The daemon fixture points teleportd's --web-dist at this (fixtures/
      # daemon.ts) -- a separate job/runner from `web`'s own build, so this
      # has to build its own copy rather than reuse that one.
      - working-directory: web
        run: npm run build
      - working-directory: web
        env:
          TELEPORTD_BIN: ${{ github.workspace }}/daemon/target/debug/teleportd
        run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
