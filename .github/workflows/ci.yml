name: CI

# issue #113: every branch push, not just `main`. Most of this repo's work
# reaches `main` as direct merge commits rather than through PRs, so a
# `branches: [main]` filter means the first time CI sees a change is after it
# is already on `main` -- `780ff74` took the Windows daemon build down and
# stayed red for a day on exactly that workflow. Running on the branch turns
# the signal into something you get before the merge.
on:
  push:
  pull_request:

# Keyed on the full `github.ref`, which differs between events
# (`refs/heads/x` vs `refs/pull/N/merge`), so a `push` run and a
# `pull_request` run for the same commit do NOT share a group.
#
# Collapsing them was the obvious move and it is wrong: a cancelled run stays
# attached to the commit and reports as a *failed* check, so a green PR shows
# red X's for the half that got cancelled. Legible signal is the entire point
# of #113, and this repo's work mostly bypasses PRs anyway -- so the duplicate
# is rare and costs less than a misleading red.
#
# What this does still collapse is the real waste: pushing twice to one branch
# cancels the superseded run. `main` is exempt, because there a run is the
# verdict on a specific commit and a later push must not erase an earlier
# commit's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # One gate, not two -- and one JOB, not two. `tasks/ci.yml` gates both
  # crates in a single file (daemon with feature_args: "", then cli), so a
  # job per crate ran the whole thing twice and the cli one did it without
  # the anchord fixture the daemon's suite needs. It is the same command a
  # developer runs before a push, so the two cannot drift.
  #
  # Supersedes daemon-fmt, cli-fmt, daemon-audit and cli-audit: the gate runs
  # fmt itself, and `cargo deny check advisories` is a superset of
  # `cargo audit`.
  #
  # The matrix jobs below stay. The gate runs on Linux; build, test and clippy
  # on macOS and Windows reach the `#[cfg(...)]` paths a Linux run never
  # compiles.
  gate:
    name: gate (daemon + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> target
            cli -> target
            anchor -> target

      # Same pinned anchor checkout as the matrix job below, for the same
      # reason: the gate runs the suite, the anchor fixtures are gated on
      # `ANCHORD_BIN`, and `ci_must_supply_an_anchord_binary` fails under CI
      # when it is unset (#108).
      - name: Check out anchor (pinned)
        uses: actions/checkout@v4
        with:
          repository: alehatsman/anchor
          ref: c755628bdf1515b2d10dab01a149e63a34eee33a
          path: anchor
      - name: Build anchord
        working-directory: anchor
        run: cargo build --release --bin anchord
      - name: Export ANCHORD_BIN
        run: echo "ANCHORD_BIN=$GITHUB_WORKSPACE/anchor/target/release/anchord" >> "$GITHUB_ENV"

      - name: Install provision
        run: cargo install --locked --git https://github.com/alehatsman/provision.git
      # Checks out rust-quality at the pin in tasks/tools.yml and installs
      # nextest, deny and machete.
      - name: Install the gate's tools
        run: provision apply tasks/tools.yml
      - name: Gate
        run: provision apply tasks/ci.yml

  test-gates:
    name: daemon (target_os gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-target-os-gates.sh

  daemon:
    name: daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> target
            anchor -> target

      # The 25 anchor fixtures are gated on `ANCHORD_BIN`, and a gate with
      # nothing behind it reports `ok` without running anything (#108). The
      # suite now refuses that: `ci_must_supply_an_anchord_binary` fails under
      # CI when the variable is unset, so this is the half that makes it pass
      # honestly rather than by removing the check.
      #
      # Pinned, not floating. Building anchor's `main` would mean a break
      # there turns this repo red for a reason that is not this repo's -- and
      # a job red for someone else's reason is how the next real failure gets
      # missed (#113). Bumping the SHA is a visible line in a diff, which is
      # the same argument `scripts/allowed-target-os-gates.tsv` makes: the
      # decision should be reviewable at the moment it is taken.
      #
      # The cost is real and worth naming: this pin goes stale silently, so
      # anchor's fixes do not reach teleport's suite until someone moves it.
      - name: Check out anchor (pinned)
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          repository: alehatsman/anchor
          ref: c755628bdf1515b2d10dab01a149e63a34eee33a
          path: anchor
      # Unix only, for now. teleport's anchor modules compile on Windows
      # (the client has a named-pipe arm), but anchord hosts no sessions there
      # until anchor's M6 transport lands, so every anchor fixture is still
      # `#![cfg(unix)]` and on Windows there is nothing here to satisfy. When
      # M6 lands this pin moves to a commit with a Windows anchord and the
      # `if:` lines go -- not before, or `ci_must_supply_an_anchord_binary`
      # would be satisfied by a binary that cannot serve the fixtures.
      - name: Build anchord
        if: runner.os != 'Windows'
        working-directory: anchor
        run: cargo build --release --bin anchord
      - name: Export ANCHORD_BIN
        if: runner.os != 'Windows'
        run: echo "ANCHORD_BIN=$GITHUB_WORKSPACE/anchor/target/release/anchord" >> "$GITHUB_ENV"

      - run: cargo build --all-targets
      # --no-fail-fast: one failing test binary used to hide every later one
      # (2026-09-05: cargo test stopping at the first failure hid three more
      # macOS-only fixtures behind it, discovered one CI round-trip at a
      # time until this flag showed the true, bounded scope in a single run).
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - run: cargo build --all-targets
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # web/.npmrc sets engine-strict, and web/package.json's engines
          # field is ts-quality's baseline (node ^24 || >=26): npm ci on an
          # older node refuses outright rather than warning.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The same four steps tasks/ui-ci.yml runs locally through ts-quality,
      # minus the provision-only ones (config drift, supply-chain posture,
      # ai-lint, soft caps). Lint and vitest never ran in CI before this.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Separate from the `web` job above on purpose: this needs a real
  # teleportd binary (docs/10-testing.md#web-e2e-playwright's daemon
  # fixture) and real browsers, both slower than lint/typecheck/build/test,
  # so a plain typo doesn't wait on a Rust build + two browser downloads.
  web-e2e:
    name: web (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target
      - run: cargo build -p teleportd
        working-directory: daemon
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      # Not just `chromium`: the "mobile" project uses devices['iPhone 14'],
      # which is WebKit -- the real engine an iPhone runs, not Chromium's
      # mobile-viewport emulation (this app is mobile-first, and this
      # session's real bugs were WebKit-specific). ts-quality's tools.sh
      # only auto-installs chromium (it has no opinion on e2e), so both are
      # installed explicitly here rather than relied on from that gate.
      - working-directory: web
        run: npx playwright install --with-deps chromium webkit
      # The daemon fixture points teleportd's --web-dist at this (fixtures/
      # daemon.ts) -- a separate job/runner from `web`'s own build, so this
      # has to build its own copy rather than reuse that one.
      - working-directory: web
        run: npm run build
      - working-directory: web
        env:
          TELEPORTD_BIN: ${{ github.workspace }}/daemon/target/debug/teleportd
        run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
