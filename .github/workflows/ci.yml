name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon-fmt:
    name: daemon (fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  daemon:
    name: daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target
      - run: cargo build --all-targets
      # --no-fail-fast: one failing test binary used to hide every later one
      # (2026-09-05: cargo test stopping at the first failure hid three more
      # macOS-only fixtures behind it, discovered one CI round-trip at a
      # time until this flag showed the true, bounded scope in a single run).
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings

  daemon-audit:
    name: daemon (audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
