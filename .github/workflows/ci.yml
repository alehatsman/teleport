name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon-fmt:
    name: daemon (fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # A `target_os` gate on a test is a platform quietly losing coverage, and
  # this repo has shipped two whose stated reasons did not survive being run
  # (#25/#32, #36). Cheap, no toolchain needed, so it runs on its own rather
  # than behind a build.
  test-gates:
    name: daemon (target_os gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-target-os-gates.sh

  daemon:
    name: daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target
      - run: cargo build --all-targets
      # --no-fail-fast: one failing test binary used to hide every later one
      # (2026-09-05: cargo test stopping at the first failure hid three more
      # macOS-only fixtures behind it, discovered one CI round-trip at a
      # time until this flag showed the true, bounded scope in a single run).
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings

  daemon-audit:
    name: daemon (audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  cli-fmt:
    name: cli (fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - run: cargo build --all-targets
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings

  cli-audit:
    name: cli (audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # web/.npmrc sets engine-strict, and web/package.json's engines
          # field is ts-quality's baseline (node ^24 || >=26): npm ci on an
          # older node refuses outright rather than warning.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The same four steps tasks/ui-ci.yml runs locally through ts-quality,
      # minus the provision-only ones (config drift, supply-chain posture,
      # ai-lint, soft caps). Lint and vitest never ran in CI before this.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
